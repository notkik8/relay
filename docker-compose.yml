services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay}@postgres:5432/${POSTGRES_DB:-relay}
      MEDIA_ROOT: /data/media
      CATALOG_DEMO: ${CATALOG_DEMO:-false}
      TMDB_DEMO: ${TMDB_DEMO:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      DISCOVERY_CATALOG: /app/discovery-catalog.json
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-http://127.0.0.1:${RELAY_HTTP_PORT:-8080}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Relay <noreply@relay.test>}
    volumes:
      - media:/data/media
      - ./frontend/public/discovery/catalog.json:/app/discovery-catalog.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${RELAY_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  https:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: ["local-mail"]
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  media:
  certificates:
  caddy_config:
